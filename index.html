<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Personal Dashboard</title>
	<link rel="stylesheet" type="text/css" href="Dashboardproject.css/Main.css">
	<link rel="stylesheet" type="text/css" href="Dashboardproject.css/Header.css">
	<link rel="stylesheet" type="text/css" href="Dashboardproject.css/Sidebar.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="side-bar">
		<div class="toggle-bar">
			<img class="toggle-bar-img" src="Dashboardproject.png/Hamburger-menu.jpg">
		</div>
		<div class="nav">
			<div class="home">
				<img class="home-img" src="Dashboardproject.png/Home-icon.jpg">
				<p>Home</p>
			</div>
			<div class="stats">
				<img class="stats-img" src="Dashboardproject.png/Stats-icon.jpg">
				<p>Stats</p>
			</div>
			<div class="tasks">
				<img class="tasks-img" src="Dashboardproject.png/Tasks-icon.jpg">
				<p>Tasks</p>
			</div>
			<div class="calendar">
				<img class="calendar-img" src="Dashboardproject.png/Calendar-icon.jpg">
				<p>Calendar</p>
			</div>
			<div class="notes">
				<img class="notes-img" src="Dashboardproject.png/Notes-icon.jpg">
				<p>Notes</p>
			</div>
		</div>
		<div class="settings">
			<img class="settings-img" src="Dashboardproject.png/Settings-icon.jpg">
			<p>Settings</p>
		</div>
	</div>

	<div class="header">
		<div class="user-message">
			<p class="hi-user">
				Hi, Priya!
				<img class="emoji" src="Dashboardproject.png/Hi-emoji.jpg">
			</p>
			<p class="today-status">Here's what's happening today.</p>
		</div>
		<div class="user-details">
			<img class="search" src="Dashboardproject.png/Search-icon.jpg">
			<img class="notifications" src="Dashboardproject.png/Notification.jpg">
			<img class="profile" src="Dashboardproject.png/user-profile.jpg">
		</div>
	</div>
</body>
</html>
